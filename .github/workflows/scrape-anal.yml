name: Scrape Anal Videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios

      - name: Verify File Existence & Run Script
        run: |
          ls -la
          node scrape-anal.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/videos/database.json
          git commit -m "Auto-added 1000 Anal videos via GitHub Action" || echo "No changes to commit"
          git push
