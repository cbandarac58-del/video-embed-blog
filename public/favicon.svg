<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark slate gradient background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Rose gradient for 'V' -->
    <linearGradient id="vGrad" x1="120" y1="120" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af" /> <!-- Rose 300 -->
      <stop offset="50%" stop-color="#e11d48" /> <!-- Rose 600 -->
      <stop offset="100%" stop-color="#be123c" /> <!-- Rose 700 -->
    </linearGradient>
    <!-- Play button glow gradient -->
    <linearGradient id="playGrad" x1="220" y1="135" x2="300" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sleek rounded dark background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="122" stroke="url(#vGrad)" stroke-width="12" stroke-opacity="0.2" />

  <!-- Glowing group -->
  <g filter="url(#neonGlow)">
    <!-- Sleek Futuristic 'V' shape -->
    <path d="M 120 120 L 256 420 L 392 120 L 320 120 L 256 270 L 192 120 Z" fill="url(#vGrad)" />

    <!-- A white/rose play triangle button glowing in the center of the 'V' cavity -->
    <path d="M 220 135 L 220 225 L 300 180 Z" fill="url(#playGrad)" />
  </g>
</svg>
